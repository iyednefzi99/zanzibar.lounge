services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://zanzibar:zanzibar@postgres:5432/zanzibar?schema=public
      DIRECT_DATABASE_URL: postgresql://zanzibar:zanzibar@postgres:5432/zanzibar?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    networks:
      - zanzibar

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: zanzibar
      POSTGRES_USER: zanzibar
      POSTGRES_PASSWORD: zanzibar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zanzibar -d zanzibar"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - zanzibar

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - zanzibar

volumes:
  postgres_data:
  redis_data:

networks:
  zanzibar:
    driver: bridge
