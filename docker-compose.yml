services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://e_coffee:e_coffee@postgres:5432/e_coffee?schema=public
      DIRECT_DATABASE_URL: postgresql://e_coffee:e_coffee@postgres:5432/e_coffee?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    networks:
      - e_coffee

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: e_coffee
      POSTGRES_USER: e_coffee
      POSTGRES_PASSWORD: e_coffee
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e_coffee -d e_coffee"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - e_coffee

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - e_coffee

volumes:
  postgres_data:
  redis_data:

networks:
  e_coffee:
    driver: bridge
